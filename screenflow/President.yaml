# ============================================================
# IMPLEMENTATION VERIFICATION RULES
# ============================================================

verification_rules:

  - >
    President must inherit Treasurer, Event Manager, and
    Secretary capabilities, but actual authorization must still
    be verified from source code.

  - >
    Do not assume clicking Remove immediately removes a member.
    Verify the popup confirmation action and backend operation.

  - >
    The supplied diagram labels the action from Point Rules as
    "Click delete icon" but targets "Active/Deactive Point Rule".
    Preserve this diagram mapping until the source code proves
    the actual icon/action semantics.

  - >
    Do not assume creating, updating, activating, or deactivating
    a Point Rule occurs when its popup is opened.

  - >
    Do not assume Award Point immediately changes a member's
    point balance. Verify submit handler, validation, and API.

  - >
    Club Member already has reward viewing/redemption features.
    President's Rewards flow contains management actions and
    should remain a separate management context until code
    confirms component reuse.

  - >
    Clicking Approve/Reject in Club Redemption Requests only
    opens the corresponding popup according to this diagram.
    Verify the final approval/rejection operation in code.

  - >
    Clicking Approve or Reject in Join Request Detail only opens
    the corresponding popup. Verify the actual confirmation and
    status transition from implementation.

  - >
    Do not assume only one Join Form can be active.
    Verify activation/deactivation constraints from source code.

  - >
    Create Form and Update Form behavior, question structures,
    validations, and form status rules must be derived from code.

  - >
    Keep all Student, Club Member, Treasurer, Event Manager,
    and Secretary capabilities available to President unless
    source code explicitly restricts a capability.