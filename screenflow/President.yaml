# ============================================================
# UniClub - President Screen Flow
#
# Role hierarchy:
#
# STUDENT
#   -> CLUB_MEMBER
#       -> CLUB_COMMITTEE
#           -> PRESIDENT
#
# President inherits capabilities from:
# - Student
# - Club Member
# - Treasurer
# - Event Manager
# - Secretary
#
# President additionally owns:
# - Member Management
# - Point Management
# - Reward Management
#
# IMPORTANT:
# - ui_action values follow the supplied screen flow.
# - Opening a popup does NOT mean an operation is completed.
# - TBD_BY_CODE must be verified against source code.
# - Do not infer APIs, handlers, validation, authorization,
#   database changes, or status transitions from this diagram.
# ============================================================


role:
  id: PRESIDENT
  name: President

  group:
    id: CLUB_COMMITTEE
    name: Club Committee


# ============================================================
# CAPABILITY INHERITANCE
# ============================================================

extends:
  role: CLUB_MEMBER
  file: club-member-screen-flow.yaml


inherits_committee_roles:

  - role: TREASURER
    file: treasurer-screen-flow.yaml

  - role: EVENT_MANAGER
    file: event-manager-screen-flow.yaml

  - role: SECRETARY
    file: secretary-screen-flow.yaml


inheritance:

  role_chain:
    - STUDENT
    - CLUB_MEMBER
    - CLUB_COMMITTEE
    - PRESIDENT

  description: >
    President is a Club Committee member with access to all
    capabilities available to Treasurer, Event Manager, and
    Secretary, together with additional President-specific
    member, point, and reward management capabilities.

  inherits_from_student:
    - authentication
    - logout
    - profile
    - requests_and_invitations
    - public_club_list
    - public_events
    - event_registration
    - event_registration_cancellation
    - event_check_in
    - event_feedback
    - feedback_deletion

  inherits_from_club_member:
    - my_clubs
    - club_detail
    - membership_fees
    - club_events
    - leave_club
    - club_member_list
    - club_leaderboard
    - point_history
    - point_rules_view
    - rewards_view
    - reward_redemption
    - reward_redemption_history
    - activity_schedule
    - club_fees
    - polls

  inherits_from_treasurer:
    - financial_dashboard
    - create_transaction_request
    - view_transaction_detail
    - update_transaction_request
    - export_financial_report

  inherits_from_event_manager:
    - club_event_management
    - create_event
    - update_event
    - cancel_event
    - create_update_timeline
    - delete_timeline
    - event_attendance
    - open_close_check_in
    - qr_scan_check_in

  inherits_from_secretary:
    - manage_activity_schedule
    - create_activity
    - update_activity
    - delete_activity
    - invitation_management
    - send_invitation
    - resend_invitation
    - cancel_invitation
    - poll_management
    - create_poll
    - update_poll
    - close_poll


# ============================================================
# PRESIDENT-SPECIFIC CAPABILITY GROUPS
# ============================================================

president_capabilities:

  member_management:
    - view_all_members
    - remove_member
    - view_member_profile
    - member_approval
    - approve_join_request
    - reject_join_request
    - join_form_management
    - create_join_form
    - update_join_form
    - activate_deactivate_join_form

  point_management:
    - manage_point_rules
    - create_point_rule
    - update_point_rule
    - activate_deactivate_point_rule
    - award_points

  reward_management:
    - manage_rewards
    - create_reward
    - update_reward
    - reward_redemption_requests
    - approve_reject_reward_redemption
    - reward_request_history
    - reward_request_history_detail


