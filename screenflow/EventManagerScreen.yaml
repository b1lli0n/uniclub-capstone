# ============================================================
# IMPLEMENTATION VERIFICATION RULES
# ============================================================

verification_rules:

  - >
    Do not assume every Club Member can access Manage Events or
    Attendance. Verify role and permission checks in source code.

  - >
    Do not treat managed_event_detail as the Student Event Detail
    screen. The supplied Event Manager diagram represents it as
    an event-management popup.

  - >
    Event Form Modal is reached from both Create Event and
    Update Event. Verify whether source code uses one shared
    component, separate modes, or separate handlers.

  - >
    Create/Update Timeline Modal is represented as one popup in
    the diagram. Verify how source code distinguishes create and
    edit timeline behavior.

  - >
    Do not assume that clicking Cancel Event immediately cancels
    the event. The diagram only establishes that it opens
    Cancel Event Confirm Modal.

  - >
    Do not assume that clicking Delete immediately deletes a
    timeline. The diagram only establishes that it opens
    Delete Timeline Confirm Modal.

  - >
    "Open/Close check-in" is one UI action in the diagram.
    Verify current status, status transition, handler, API,
    validation, and resulting state from source code.

  - >
    Do not infer QR format, QR payload, scanner library, attendee
    validation, duplicate check-in handling, or check-in API
    from the screen flow.

  - >
    Keep inherited Student and Club Member functionality
    available unless source code explicitly restricts it.