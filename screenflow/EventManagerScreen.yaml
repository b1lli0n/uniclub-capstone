# ============================================================
# FLOW DEFINITIONS
# ============================================================

flows:

  # ----------------------------------------------------------
  # Authentication
  # ----------------------------------------------------------

  - from: login
    action: Login successfully
    to: home_event_manager
    inherited_behavior_from: student-screen-flow.yaml

  - from: home_event_manager
    action: Click logout icon
    to: logout
    inherited_behavior_from: student-screen-flow.yaml

  - from: logout
    action: Click "Yes" button
    to: login
    inherited_behavior_from: student-screen-flow.yaml


  # ----------------------------------------------------------
  # My Clubs
  # ----------------------------------------------------------

  - from: home_event_manager
    action: Click "My Clubs" button
    to: my_clubs

  - from: my_clubs
    action: Click club card
    to: event_manager_club_detail


  # ----------------------------------------------------------
  # Event Management
  # ----------------------------------------------------------

  - from: event_manager_club_detail
    action: Click "Manage Events" button
    to: club_event_management

  - from: club_event_management
    action: Click "View" button
    to: managed_event_detail

  - from: club_event_management
    action: Click "Create Event" button
    to: event_form_modal


  # ----------------------------------------------------------
  # Managed Event Detail
  # ----------------------------------------------------------

  - from: managed_event_detail
    action: Click "Cancel Event" button
    to: cancel_event_confirm_modal

  - from: managed_event_detail
    action: Click "Add Timeline/Edit" button
    to: create_update_timeline_modal

  - from: managed_event_detail
    action: Click "Delete" button
    to: delete_timeline_confirm_modal

  - from: managed_event_detail
    action: Click "Update Event" button
    to: event_form_modal


  # ----------------------------------------------------------
  # Attendance
  # ----------------------------------------------------------

  - from: event_manager_club_detail
    action: Click "Attendance" button
    to: event_attendance_page

  - from: event_attendance_page
    action: Click "Open/Close check-in" button
    to: checkin_confirm_modal

  - from: event_attendance_page
    action: Click "QR Scan" button
    to: qr_scan_checkin


