# ============================================================
# UniClub - Event Manager Screen Flow
#
# Role hierarchy:
#
# STUDENT
#   -> CLUB_MEMBER
#       -> CLUB_COMMITTEE
#           -> EVENT_MANAGER
#
# Parent specification:
#   club-member-screen-flow.yaml
#
# IMPORTANT:
# - Event Manager inherits all Student and Club Member features.
# - This file contains Event Manager-specific extensions.
# - ui_action values come from the supplied screen flow.
# - TBD_BY_CODE must be verified against source code.
# - Do not infer API, handler, validation, authorization,
#   status transitions, or database behavior from this diagram.
# ============================================================


role:
  id: EVENT_MANAGER
  name: Event Manager

  group:
    id: CLUB_COMMITTEE
    name: Club Committee


extends:
  role: CLUB_MEMBER
  file: club-member-screen-flow.yaml


# ============================================================
# INHERITANCE
# ============================================================

inheritance:

  description: >
    Event Manager is a Club Committee role and is also a Club
    Member. Event Manager inherits Student and Club Member
    capabilities and gains event-management functionality.

  role_chain:
    - STUDENT
    - CLUB_MEMBER
    - CLUB_COMMITTEE
    - EVENT_MANAGER

  inherits_from_student:
    - authentication
    - logout
    - profile
    - requests_and_invitations
    - public_club_list
    - public_events
    - event_registration
    - event_registration_cancellation
    - event_check_in
    - event_feedback
    - feedback_deletion

  inherits_from_club_member:
    - my_clubs
    - club_detail
    - membership_fees
    - club_events
    - leave_club
    - club_member_list
    - club_leaderboard
    - point_history
    - point_rules
    - rewards
    - reward_redemption
    - reward_redemption_history
    - activity_schedule
    - club_fees
    - polls


# ============================================================
# LEGEND
# ============================================================

legend:
  initial_screen: Initial Screen
  screen: Screen
  popup: Popup


# ============================================================
# EVENT MANAGER SCREENS / EXTENSIONS
# ============================================================

screens:

  # ----------------------------------------------------------
  # HOME - EVENT MANAGER
  # ----------------------------------------------------------

  - id: home_event_manager
    name: Home (Event Manager)
    type: screen

    role_variant_of: home_student

    incoming:

      - from: login
        action: Login successfully
        inherited_from: student-screen-flow.yaml

    actions:

      - id: open_my_clubs
        ui_action: Click "My Clubs" button
        trigger: click

        target:
          id: my_clubs
          name: My Clubs
          type: screen
          inherited_from: club-member-screen-flow.yaml

        implementation:
          handler: TBD_BY_CODE
          route: TBD_BY_CODE
          behavior: TBD_BY_CODE


      - id: open_logout
        ui_action: Click logout icon
        trigger: click

        target:
          id: logout
          name: Logout
          type: popup
          inherited_from: student-screen-flow.yaml

        implementation:
          handler: TBD_BY_CODE
          behavior: TBD_BY_CODE


  # ----------------------------------------------------------
  # LOGOUT REFERENCE
  # ----------------------------------------------------------

  - id: event_manager_logout_reference
    references_screen: logout
    inherited_from: student-screen-flow.yaml

    reachable_from:

      - screen: home_event_manager
        action: Click logout icon

    inherited_actions:

      - ui_action: Click "Yes" button

        target:
          id: login
          name: Login
          type: initial_screen


  # ----------------------------------------------------------
  # MY CLUBS REFERENCE
  # ----------------------------------------------------------

  - id: event_manager_my_clubs_reference
    references_screen: my_clubs
    inherited_from: club-member-screen-flow.yaml

    reachable_from:

      - screen: home_event_manager
        action: Click "My Clubs" button

    actions:

      - id: view_event_manager_club_detail
        ui_action: Click club card
        trigger: click

        target:
          id: event_manager_club_detail
          name: Club Detail
          type: screen

        implementation:
          handler: TBD_BY_CODE
          route: TBD_BY_CODE
          selected_club: TBD_BY_CODE


  # ----------------------------------------------------------
  # CLUB DETAIL - EVENT MANAGER EXTENSION
  # ----------------------------------------------------------

  - id: event_manager_club_detail
    name: Club Detail
    type: screen

    extends_screen: member_club_detail
    inherited_from: club-member-screen-flow.yaml

    incoming:

      - from: my_clubs
        action: Click club card

    additional_actions:

      # ------------------------------------------------------
      # MANAGE EVENTS
      # ------------------------------------------------------

      - id: open_club_event_management
        ui_action: Click "Manage Events" button
        trigger: click

        target:
          id: club_event_management
          name: Club Event Management
          type: screen

        implementation:
          handler: TBD_BY_CODE
          route: TBD_BY_CODE
          authorization: TBD_BY_CODE
          behavior: TBD_BY_CODE


      # ------------------------------------------------------
      # EVENT ATTENDANCE
      # ------------------------------------------------------

      - id: open_event_attendance
        ui_action: Click "Attendance" button
        trigger: click

        target:
          id: event_attendance_page
          name: Event Attendance Page
          type: screen

        implementation:
          handler: TBD_BY_CODE
          route: TBD_BY_CODE
          authorization: TBD_BY_CODE
          behavior: TBD_BY_CODE


  # ==========================================================
  # CLUB EVENT MANAGEMENT
  # ==========================================================

  - id: club_event_management
    name: Club Event Management
    type: screen

    incoming:

      - from: event_manager_club_detail
        action: Click "Manage Events" button

    actions:

      # ------------------------------------------------------
      # VIEW MANAGED EVENT DETAIL
      # ------------------------------------------------------

      - id: view_managed_event_detail
        ui_action: Click "View" button
        trigger: click

        target:
          id: managed_event_detail
          name: Event Detail
          type: popup

        implementation:
          handler: TBD_BY_CODE
          selected_event: TBD_BY_CODE
          service: TBD_BY_CODE
          api: TBD_BY_CODE
          authorization: TBD_BY_CODE
          behavior: TBD_BY_CODE


      # ------------------------------------------------------
      # CREATE EVENT
      # ------------------------------------------------------

      - id: open_create_event_form
        ui_action: Click "Create Event" button
        trigger: click

        target:
          id: event_form_modal
          name: Event Form Modal
          type: popup

        context:
          mode: create

        implementation:
          handler: TBD_BY_CODE
          authorization: TBD_BY_CODE
          behavior: TBD_BY_CODE


  # ==========================================================
  # MANAGED EVENT DETAIL
  #
  # IMPORTANT:
  # This is NOT the inherited Student "Event Detail" screen.
  # The diagram represents this Event Detail as a popup.
  # ==========================================================

