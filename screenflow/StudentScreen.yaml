# ============================================================
# NAVIGATION / INTERACTION FLOW
# ============================================================

flows:

  # Authentication

  - from: login
    action: Login successfully
    to: home_student

  - from: home_student
    action: Click logout icon
    to: logout

  - from: logout
    action: Click "Yes" button
    to: login


  # Profile

  - from: home_student
    action: Click "My profile" button
    to: my_profile

  - from: my_profile
    action: Click "Edit" button
    to: update_profile


  # Requests & Invitations

  - from: home_student
    action: Click "My requests" button
    to: my_request_and_invitations

  - from: my_request_and_invitations
    action: Click "View Details" button
    to: join_request_detail

  - from: my_request_and_invitations
    action: Click "Cancel request" button
    to: cancel_join_request_popup

  - from: my_request_and_invitations
    action: Click "Received invitation" button
    to: received_invitation

  - from: received_invitation
    action: Click "View Details" button
    to: received_detail

  - from: received_invitation
    action: Click "Accept/Reject" button
    to: accept_reject_club_invitation


  # Create Club

  - from: home_student
    action: Click "Create Club" button
    to: request_to_create_club


  # Clubs

  - from: home_student
    action: Click "Clubs" button
    to: list_of_clubs

  - from: list_of_clubs
    action: Click club card
    to: club_detail

  - from: club_detail
    action: Click "Join now" button
    to: request_to_join_club


  # My Events

  - from: home_student
    action: Click "My events" button
    to: my_events

  - from: my_events
    action: Click event card
    to: event_detail


  # Public Events

  - from: home_student
    action: Click "Events" button
    to: public_event

  - from: public_event
    action: Click event card
    to: event_detail


  # Event Actions

  - from: event_detail
    action: Click "Register for event" button
    to: register_for_event_popup

  - from: event_detail
    action: Click "Cancel registration" button
    to: cancel_event_registration_popup

  - from: event_detail
    action: Click "View registration info" button
    to: check_in_event

  - from: event_detail
    action: Click "Write/Edit feedback" button
    to: feedback

  - from: feedback
    action: Click "Delete" button
    to: delete_feedback_event


