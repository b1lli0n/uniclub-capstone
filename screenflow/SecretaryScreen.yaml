# ============================================================
# IMPLEMENTATION VERIFICATION RULES
# ============================================================

verification_rules:

  - >
    Do not assume every Club Member can access Manage Schedule,
    Invitations, or poll-management actions. Verify Secretary
    authorization in source code.

  - >
    The diagram shows Activity Form Modal for both Create and
    Edit. Verify whether source code actually reuses one
    component or uses different implementations.

  - >
    Clicking the Delete icon only opens Delete Activity Confirm.
    Do not state that the activity is deleted until the confirm
    action and backend behavior are verified from code.

  - >
    Clicking Send Invitation only opens Invitation Form Modal.
    The actual send operation, validation, recipient rules,
    invitation status, and API must be verified from source code.

  - >
    Clicking Resend only opens Resend Invitation Confirm Modal.
    Do not assume that an invitation has been resent.

  - >
    Clicking Cancel only opens Cancel Invitation Confirm Modal.
    Do not assume that an invitation has been cancelled.

  - >
    The diagram uses Poll Form Modal for both Create Poll and
    Edit Poll. Verify create/edit mode handling from source code.

  - >
    Clicking Close Poll only opens Close Poll Modal.
    Verify the confirmation action and actual poll status
    transition from source code.

  - >
    Do not assume Secretary's Poll Detail is identical to the
    Club Member Poll Detail & Vote popup. Secretary has
    management actions in this diagram, so keep the two
    contexts separate until code proves they use the same
    component.

  - >
    Keep all inherited Student and Club Member functionality
    available unless source code explicitly restricts it.