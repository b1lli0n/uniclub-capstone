# ============================================================
# UniClub - Secretary Screen Flow
#
# Role hierarchy:
#
# STUDENT
#   -> CLUB_MEMBER
#       -> CLUB_COMMITTEE
#           -> SECRETARY
#
# Parent specification:
#   club-member-screen-flow.yaml
#
# IMPORTANT:
# - Secretary inherits all Student and Club Member capabilities.
# - This file contains Secretary-specific extensions.
# - ui_action values are derived from the supplied screen flow.
# - TBD_BY_CODE must be verified against source code.
# - Opening a modal does NOT mean the operation has completed.
# - Do not infer APIs, handlers, validation, authorization,
#   database effects, or status transitions from the diagram.
# ============================================================


role:
  id: SECRETARY
  name: Secretary

  group:
    id: CLUB_COMMITTEE
    name: Club Committee


extends:
  role: CLUB_MEMBER
  file: club-member-screen-flow.yaml


# ============================================================
# INHERITANCE
# ============================================================

inheritance:

  description: >
    Secretary is a Club Committee role and is also a Club Member.
    Secretary inherits Student and Club Member capabilities and
    gains schedule, invitation, and poll-management functions.

  role_chain:
    - STUDENT
    - CLUB_MEMBER
    - CLUB_COMMITTEE
    - SECRETARY

  inherits_from_student:
    - authentication
    - logout
    - profile
    - requests_and_invitations
    - public_club_list
    - public_events
    - event_registration
    - event_registration_cancellation
    - event_check_in
    - event_feedback
    - feedback_deletion

  inherits_from_club_member:
    - my_clubs
    - club_detail
    - membership_fees
    - club_events
    - leave_club
    - club_member_list
    - club_leaderboard
    - point_history
    - point_rules
    - rewards
    - reward_redemption
    - reward_redemption_history
    - activity_schedule
    - club_fees
    - polls


# ============================================================
# LEGEND
# ============================================================

legend:
  initial_screen: Initial Screen
  screen: Screen
  popup: Popup


