    to: leave_club

  - from: member_club_detail
    action: Click "View all members" button
    to: club_member_list


  # Point / Ranking

  - from: member_club_detail
    action: Click "Ranking" button
    to: club_leaderboard

  - from: club_leaderboard
    action: Click "My point history" button
    to: my_point_history

  - from: member_club_detail
    action: Click "Point Rules" button
    to: point_rules


  # Rewards

  - from: member_club_detail
    action: Click "Rewards" button
    to: rewards

  - from: rewards
    action: Click reward card
    to: reward_detail

  - from: reward_detail
    action: Click "Redeem reward" button
    to: redeem_reward_popup

  - from: member_club_detail
    action: Click "Reward redemption history" button
    to: reward_redemption_history

  - from: reward_redemption_history
    action: Click "View detail" button
    to: reward_history_detail


  # Schedule

  - from: member_club_detail
    action: Click "Schedule" button
    to: activity_schedule

  - from: activity_schedule
    action: Click activity card
    to: activity_detail


  # Fees

  - from: member_club_detail
    action: Click "Fees" button
    to: club_fees

  - from: club_fees
    action: Click "Payment VNPay" button
    to: vnpay_payment

  - from: club_fees
    action: Click "View payment receipt" button
    to: club_fee_receipt_detail


  # Polls

  - from: member_club_detail
    action: Click "Polls" button
    to: polls

  - from: polls
    action: Click "View & Vote" button
    to: poll_detail_and_vote


