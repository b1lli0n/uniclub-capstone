# ============================================================
# UniClub - Club Member Screen Flow
#
# Inheritance:
#   Club Member inherits all Student capabilities.
#
# Parent specification:
#   student-screen-flow.yaml
#
# IMPORTANT:
# - ui_action labels are taken from the supplied screen flow.
# - Student features are NOT duplicated here.
# - TBD_BY_CODE must be verified against source code.
# - Do not infer APIs, handlers, validations, or business rules.
# ============================================================

role:
  id: CLUB_MEMBER
  name: Club Member

extends:
  role: STUDENT
  file: student-screen-flow.yaml

inheritance:
  description: >
    Club Member has all capabilities of Student and gains
    additional club-member-specific functionality.

  inherits:
    - authentication
    - logout
    - profile
    - student_requests_and_invitations
    - public_club_list
    - public_event_list
    - event_registration
    - event_registration_cancellation
    - event_check_in
    - event_feedback
    - feedback_deletion

legend:
  initial_screen: Initial Screen
  screen: Screen
  popup: Popup


