# ============================================================
# FLOW DEFINITIONS
# ============================================================

flows:

  # Home extensions

  - from: home_student
    action: Click "My Clubs" button
    to: my_clubs

  - from: home_student
    action: Click "My Membership Fees" button
    to: my_membership_fees


  # Membership Fees

  - from: my_membership_fees
    action: Click "Payment VNPay" button
    to: membership_fee_payment

  - from: my_membership_fees
    action: Click "View payment receipt" button
    to: membership_fee_receipt_detail


  # My Clubs

  - from: my_clubs
    action: Click club card
    to: member_club_detail


  # Club Events

  - from: member_club_detail
    action: Click "View all" button
    to: all_club_events

  - from: all_club_events
    action: Click event card
    to: event_detail


  # Club Membership

  - from: member_club_detail
